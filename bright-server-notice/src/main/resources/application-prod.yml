server:
  port: 8183

spring:
  datasource:
    druid:
      initialSize: 10                       # 连接池初始化连接数
      min-idle: 10                           # 连接池最小空闲连接数
      max-active: 200                        # 连接池最大连接数
      max-wait: 60000                        # 获取连接时最大等待时间，单位毫秒。配置了maxWait之后，缺省启用公平锁，并发效率会有所下降，如果需要可以通过配置useUnfairLock属性为true使用非公平锁。
      keep-alive: true                       # 连接池中的minIdle数量以内的连接，空闲时间超过minEvictableIdleTimeMillis，则会执行keepAlive操作。
      test-while-idle: true                   # 建议配置为true，不影响性能，并且保证安全性。申请连接的时候检测，如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
      test-on-borrow: true                   # 申请连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      test-on-return: false                   # 归还连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      pool-prepared-statements: true        # 是否缓存preparedStatement，也就是PSCache。PSCache对支持游标的数据库性能提升巨大，比如说oracle。在mysql5.5以下的版本中没有PSCache功能，建议关闭掉。5.5及以上版本有PSCache，建议开启。
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000  # 配置間隔多久才進行一次檢測，檢測需要關閉的空閒連線，單位是毫秒
      min-evictable-idle-time-millis: 300000    # 配置一個連線在池中最小生存的時間，單位是毫秒
      filters: wall,stat           # 配置监控统计拦截的filters，监控统计用的filter:sta, 日志用的filter:log4j
      filter:
        wall:
          enabled: true
          config:
            strict-syntax-check: true
            comment-allow: true
            multi-statement-allow: true
            delete-where-none-check: true

      # 以下的2段配置，同时适用于所有模式
      web-stat-filter: # WebStatFilter配置，说明请参考Druid Wiki，配置_配置WebStatFilter
        enabled: true
        url-pattern: /*
        exclusions: "*.js , *.gif ,*.jpg ,*.png ,*.css ,*.ico , /druid/*"
        session-stat-max-count: 1000
        profile-enable: true
        session-stat-enable: false
      stat-view-servlet: #展示Druid的统计信息,StatViewServlet的用途包括：1.提供监控信息展示的html页面2.提供监控信息的JSON API
        enabled: true
        url-pattern: /druid/*   #根据配置中的url-pattern来访问内置监控页面，如果是上面的配置，内置监控页面的首页是/druid/index.html例如：http://127.0.0.1:9000/druid/index.html
        reset-enable: true    #允许清空统计数据
        login-username: 'admin'
        login-password: 'Bright@2025'
        allow: ''

    dynamic:
      primary: master #设置默认的数据源或者数据源组,默认值即为master
      strict: false #严格匹配数据源,默认false. true未匹配到指定数据源时抛异常,false使用默认数据源
      p6spy: true
      datasource:
        master:
          url: jdbc:p6spy:mysql://127.0.0.1:3306/bright_dubbo?useUnicode=true&characterEncoding=UTF-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2b8
          username: root
          password: 123456
          driver-class-name: com.p6spy.engine.spy.P6SpyDriver #com.mysql.cj.jdbc.Driver
          druid:
            validationQuery: select 1

  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      timeout: 3600ms
      #      cluster:
      #        max-redirects: 3
      #        nodes: 127.0.0.1:7000, 127.0.0.1:7001, 127.0.0.1:7002, 127.0.0.1:7003, 127.0.0.1:7004, 127.0.0.1:7005
      lettuce:
        pool:
          max-active: 100
          max-idle: 100
          min-idle: 50
          max-wait: 6000ms
        shutdown-timeout: 100ms
  boot:
    admin:
      client:
        url: http://${NACOS_HOST:@nacos.host@}:8180
        username: admin
        password: Bright@2025

dubbo:
  scan:
    base-packages: com.tml.**.service.impl
  registry:
    address: nacos://${NACOS_HOST:@nacos.host@}:${NACOS_PORT:@nacos.port@}?username=${NACOS_USERNAME:@nacos.username@}&password=${NACOS_PASSWORD:@nacos.password@}&namespace=${NACOS_NAMESPACE:@nacos.namespace@}
    register-mode: instance
    parameters:
      register-consumer-url: true
  protocol:
    name: tri
    port: 8184
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
    # 序列化检查 STRICT（严格检查）,WARN（告警）,DISABLE（禁用）
    serialize-check-status: DISABLE
  provider:
    group: bright-dubbo
    version: 1.0.0
    timeout: 60000
    loadbalance: roundrobin
    weight: 5
    retries: 2
    executes: 200
  consumer:
    group: bright-dubbo
    version: 1.0.0
    timeout: 60000
    loadbalance: roundrobin
    retries: 2
    check: false

bright:
  cache:
    type: REDIS
    serializerType: JACKSON
    cacheNullVal: true


