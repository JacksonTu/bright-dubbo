version: '3.8'

x-common-variables: &common-variables
  NACOS_IP: 127.0.0.1
  NACOS_PORT: 8848
  NACOS_NAMESPACE: public
  NACOS_USERNAME: nacos
  NACOS_PASSWORD: nacos

x-common-config: &common-config
  restart: always
  volumes:
    - /home/project/bright-dubbo/logs:/logs
  networks:
    - dubbo
  logging:
    driver: "json-file"
    options:
      max-size: "1024M"
      max-file: "3"

services:
  bright-monitor:
    <<: *common-config
    build:
      context: ./bright-monitor
    container_name: bright-monitor
    image: bright-monitor:3.1.0
    environment:
      <<: *common-variables
    ports:
      - "8180:8180"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8180/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bright-server-base:
    <<: *common-config
    build:
      context: ./bright-server-base
    container_name: bright-server-base
    image: bright-server-base:3.1.0
    environment:
      <<: *common-variables
    ports:
      - "8181:1881"
      - "8182:1882"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bright-server-notice:
    <<: *common-config
    build:
      context: ./bright-server-notice
    container_name: bright-server-notice
    image: bright-server-notice:3.1.0
    environment:
      <<: *common-variables
    ports:
      - "8183:8183"
      - "8184:8184"
    depends_on:
      - bright-server-base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8183/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bright-web-base:
    <<: *common-config
    build:
      context: ./bright-web-base
    container_name: bright-web-base
    image: bright-web-base:3.1.0
    environment:
      <<: *common-variables
    ports:
      - "8190:8190"
      - "8191:8191"
    depends_on:
      - bright-server-base
      - bright-server-notice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8190/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dubbo:
    name: app_net
    external: true

# 常用命令说明
# ===== 构建与部署 =====
# 1. 打包
# mvn clean package -D profile.active=prod -D skipTests=true
# mvn clean package -D profile.active=test -D skipTests=true
# mvn clean package -D profile.active=dev -D skipTests=true

# 2. 创建并启动所有容器
# docker-compose -p bright-dubbo up -d

# 3. 启动所有容器
# docker-compose -p bright-dubbo start

# 4. 停止所有容器
# docker-compose -p bright-dubbo stop

# 5. 查看容器状态
# docker-compose -p bright-dubbo ps

# 6. 删除所有容器
# docker-compose -p bright-dubbo rm

# ===== 镜像管理 =====
# 7. 按关键字批量删除镜像(bright为关键字)
# docker rmi --force $(docker images | grep bright | awk '{print $3}')

# 8. 删除已退出的容器
# docker rm $(docker ps -qf status=exited)

# 9. 停止所有容器
# docker stop $(docker ps -a -q)

# 10. 删除none标签的镜像
# docker images | grep none | awk '{print $3}' | xargs docker rmi

# 11. 查看容器日志
# docker logs -f 容器名称

# ===== 网络配置 =====
# 12. 创建网络(用于docker-compose之间通讯)
# docker network create app_net -d bridge --subnet 172.30.0.0/16

# 13. 重新构建并启动特定服务
# docker-compose -p bright-dubbo up -d --build 服务名称